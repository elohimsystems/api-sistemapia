name: Deploy API

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm run build

      - name: Package for FTP
        run: |
          mkdir -p deploy-package
          cp -r build/. deploy-package/
          cp package.json package-lock.json deploy-package/

      - name: Package node_modules
        run: |
          zip -r node_modules.zip node_modules/

      - uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules.zip

      - name: Deploy via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }};
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:max-retries 3;
            mirror -R --delete --verbose \
              --exclude .git \
              ./deploy-package/ ./;
            put -O ./ node_modules.zip;
            quit
          "
          echo ""
          echo "=================================================="
          echo "  Todo subido por FTP."
          echo "  Extrae node_modules.zip en cPanel File Manager"
          echo "  en /home/sistem19/public_html/dev.api-sistemapia.com.ve/"
          echo "  Luego reinicia la Node.js App."
          echo "=================================================="
