name: Deploy API

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm run build

      - name: Prepare deploy package
        run: |
          ls -la build/ 2>/dev/null || echo "build/ empty or missing"
          mkdir -p deploy-package
          cp -r build/. deploy-package/ 2>/dev/null || true
          cp package.json package-lock.json deploy-package/ 2>/dev/null || true
          ls -la deploy-package/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: ${{ secrets.FTP_API_DIR }}
