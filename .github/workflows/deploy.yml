name: Deploy API

on:
  push:
    branches: [develop, main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm run build

      - name: Package for FTP
        run: |
          mkdir -p deploy-package
          cp -r build/. deploy-package/
          cp package.json package-lock.json deploy-package/

      - name: Package node_modules
        run: |
          zip -r node_modules.zip node_modules/

      - uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules.zip

      - name: Deploy via FTP
        env:
          IS_PROD: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
          FTP_USERNAME: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && secrets.FTP_USERNAME_PROD || secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && secrets.FTP_PASSWORD_PROD || secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && secrets.FTP_HOST_PROD || secrets.FTP_HOST }}
        run: |
          echo "Desplegando a $([ $IS_PROD = true ] && echo 'PRODUCCIÓN' || echo 'DESARROLLO')..."
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST;
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:max-retries 3;
            mirror -R --verbose \
              --exclude .git \
              --exclude .htaccess \
              ./deploy-package/ ./;
            quit
          "
          NODE_EXISTS=$(lftp -c "
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST;
            set ftp:ssl-allow no;
            set net:max-retries 3;
            cls -1 --list node_modules/ 2>/dev/null | head -1;
            quit
          ")
          if [ -z "$NODE_EXISTS" ]; then
            echo "node_modules/ no existe, subiendo zip..."
            lftp -c "
              open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST;
              set ftp:ssl-allow no;
              set ftp:passive-mode on;
              set net:max-retries 3;
              put -O ./ node_modules.zip;
              quit
            "
            echo "Zip subido. Extraelo en cPanel File Manager y reinicia la app."
          else
            echo "node_modules/ ya existe, zip omitido"
          fi
