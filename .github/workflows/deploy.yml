name: Deploy API

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm run build

      - name: Package deploy
        run: |
          mkdir -p deploy-package
          cp -r build/. deploy-package/
          cp package.json package-lock.json deploy-package/
          rsync -a node_modules/ deploy-package/node_modules/
          cd deploy-package
          zip -r ../deploy.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: api-deploy
          path: deploy.zip

      - name: Deploy via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }};
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:max-retries 3;
            mirror -R --delete --verbose \
              --exclude node_modules/ \
              --exclude .git \
              ./deploy-package/ ./;
            quit
          "
          echo ""
          echo "=================================================="
          echo "  node_modules/ no se pudo subir por FTP."
          echo "  Descarga el artifact 'api-deploy.zip' de este"
          echo "  Action, extraelo en cPanel File Manager en:"
          echo "  /home/sistem19/public_html/dev.api-sistemapia.com.ve/"
          echo "  Luego reinicia la Node.js App."
          echo "=================================================="
