name: Deploy API

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm run build

      - name: Prepare deploy package
        run: |
          mkdir -p deploy-package
          cp -r build/. deploy-package/
          cp package.json package-lock.json deploy-package/
          rsync -a node_modules/ deploy-package/node_modules/

      - name: Deploy via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "
            set ftp:ssl-allow true;
            set net:max-retries 3;
            mirror -R --delete --verbose \
              ./deploy-package/ ./;
            quit
          " -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            ${{ secrets.FTP_HOST }}
